<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Stackly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<main class="auth">
  <aside data-aos="fade" data-aos-duration="1200" class="art art-signup" style="background-image: url('assets/images/dining-room-candlelit.webp');">
    <a href="index.html" class="logo"><img src="assets/images/logo.webp" alt="Stackly"></a>
    <p class="q">Twenty-eight seats. One tasting menu.</p>
  </aside>
  <section class="panel">
    <div class="box">
      <a href="index.html" class="logo m-logo"><img src="assets/images/logo.webp" alt="Stackly"></a>
      <h1 data-aos="fade-up">Reserve your place.</h1>
      <p data-aos="fade-up" data-aos-delay="80">Create an account to book tables and follow your visits.</p>
      <form data-aos="fade-up" data-aos-delay="160" id="auth" data-mode="signup" novalidate>
        <div class="seg" role="radiogroup" aria-label="Sign up as">
          <label><input type="radio" name="role" value="user" checked><span>User</span></label>
          <label><input type="radio" name="role" value="admin"><span>Admin</span></label>
        </div>
        <label class="f">Full name<input type="text" name="name" autocomplete="name"><small class="err"></small></label>
        <label class="f">Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com"><small class="err"></small></label>
        <label class="f">Password<span class="pw"><input type="password" name="password" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></span><small class="err"></small></label>
        <label class="f">Confirm password<span class="pw"><input type="password" name="confirm" autocomplete="new-password"><button type="button" class="eye" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></span><small class="err"></small></label>
        <label class="terms"><input type="checkbox" name="terms"> <span>I agree to the <a href="404.html">terms</a> and <a href="404.html">privacy policy</a>.</span></label>
        <small class="err terms-err"></small>
        <button class="btn" type="submit"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> Create account</button>
        <p class="note" role="status"></p>
      </form>
      <p data-aos="fade-up" data-aos-delay="240" class="sw">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
