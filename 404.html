<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Stackly</title>
<meta name="description" content="The page you are looking for could not be found at Stackly.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/404.css">

<body>

<main class="nf" id="nf">
  <!-- decorative arched window, echoes the hero -->
  <div class="arch-bg" aria-hidden="true"></div>

  <div class="nf-inner">
    <p class="kicker">Page not found.</p>

    <!-- 4 [plate under a cloche] 4 -->
    <div class="code" role="img" aria-label="Error 404">
      <span class="dg" aria-hidden="true">4</span>
      <svg class="plate" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor">
        <circle class="draw" cx="50" cy="50" r="48" pathLength="1" stroke-width="1"/>
        <circle class="ring" cx="50" cy="50" r="43" stroke-width=".6" stroke-dasharray="1 3.2" stroke-linecap="round"/>
        <circle class="draw" cx="50" cy="50" r="37" pathLength="1" stroke-width=".7" opacity=".6"/>
        <line x1="24" y1="62" x2="76" y2="62" stroke-width="1.2" stroke-linecap="round"/>
        <g id="lid">
          <path d="M28 62 A22 22 0 0 1 72 62" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="50" cy="36.5" r="2.6" fill="currentColor" stroke="none"/>
        </g>
      </svg>
      <span class="dg" aria-hidden="true">4</span>
    </div>

    <h1 class="title" aria-label="This table isn’t set.">
      <span class="line"><span>This table</span></span>
      <span class="line"><span><em>isn’t set.</em></span></span>
    </h1>

    <p class="msg">The page you are looking for has been cleared away, or it was never on the menu. Let us take you back to the dining room.</p>

    <div class="cta">
      <a href="index.html" class="btn"><i class="fa-solid fa-house" aria-hidden="true"></i> Back to home</a>
      <button type="button" class="btn btn-ghost" id="goBack"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Go back</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="assets/js/404.js"></script>
</body>
</html>
